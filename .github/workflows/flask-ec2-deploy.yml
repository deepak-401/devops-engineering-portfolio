name: Flask EC2 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "01-github-actions/flask-apache-ec2-deployment/**"

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./01-github-actions/flask-apache-ec2-deployment

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest
        
      - name : upload application artifact
        uses : actions/upload-artifact@v7
        with :
            name : flask-app
            path : 01-github-actions/flask-apache-ec2-deployment/

  deploy :
    needs: build
    runs-on : ubuntu-latest
    steps :
        - name : Download application artifact
          uses : actions/download-artifact@v8
          with :
            name : flask-app
            path : flask-app
        - name : copy application to ec2
          uses : appleboy/scp-action@v1
          with :
            host : ${{secrets.EC2_HOST}}
            username : ${{secrets.EC2_USER}}
            key : ${{secrets.EC2_SSH_KEY}}
            script : |
                cd /home/ubuntu/cloudxdeepak/flask-app
                python3 -m venv .venv
                source .venv/bin/activate
                pip install -r requirements.txt
                sudo systemctl restart cloudxdeepak


