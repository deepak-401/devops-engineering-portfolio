name: Flask EC2 CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "01-github-actions/flask-apache-ec2-deployment/**"
      - ".github/workflows/flask-ec2-deploy.yml"

  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./01-github-actions/flask-apache-ec2-deployment

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      - name: Upload application artifact
        uses: actions/upload-artifact@v7
        with:
          name: flask-app
          path: 01-github-actions/flask-apache-ec2-deployment/


  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Download application artifact
        uses: actions/download-artifact@v8
        with:
          name: flask-app
          path: flask-app

      - name: Copy application to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          source: "flask-app/*"
          target: "/home/ubuntu/cloudxdeepak/flask-app"
          rm: true

      - name: Start Flask application
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            cd /home/ubuntu/cloudxdeepak/flask-app

            python3 -m venv .venv
            source .venv/bin/activate

            pip install --upgrade pip
            pip install -r requirements.txt

            sudo systemctl daemon-reload
            sudo systemctl enable cloudxdeepak
            sudo systemctl restart cloudxdeepak

            sudo systemctl restart apache2